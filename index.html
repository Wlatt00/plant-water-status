<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Plant movement and water status</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0b0f0d;
      color: #f5f7f6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    main {
      width: min(100%, 1400px);
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100svh - 24px);
      object-fit: contain;
      background: #000;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <video
      autoplay
      muted
      loop
      playsinline
      controls
      preload="metadata"
      aria-label="Time-lapse visualization of plant movement under different water-stress conditions">
      <source src="comparison_web.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </main>
</body>
</html>
